name: Build QEMU 3Dfx/MESA (Linux)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manually triggering the build from the GitHub UI

jobs:
  build-ubuntu:
    name: Build QEMU on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            rsync \
            patch \
            python3 \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            libsdl2-dev \
            libepoxy-dev \
            libgbm-dev \
            libvirglrenderer-dev \
            libslirp-dev

      - name: Download QEMU upstream source
        run: |
          wget https://download.qemu.org/qemu-10.1.0.tar.xz
          tar -xf qemu-10.1.0.tar.xz

      - name: Overlay 3Dfx/MESA modules and patch QEMU
        run: |
          cd qemu-10.1.0
          rsync -r ../qemu-0/hw/3dfx ../qemu-1/hw/mesa ./hw/
          patch -p0 -i ../00-qemu110x-mesa-glide.patch
          bash ../scripts/sign_commit

      - name: Configure and compile QEMU
        run: |
          mkdir -p build
          cd build
          ../qemu-10.1.0/configure \
            --target-list=i386-softmmu \
            --enable-sdl \
            --enable-opengl \
            --prefix=$(pwd)/../install_dir
          make -j$(nproc) install

      - name: Package build artifacts
        run: |
          tar -czvf qemu-3dfx-ubuntu-x86_64.tar.gz -C install_dir .

      - name: Upload QEMU build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qemu-3dfx-ubuntu-x86_64
          path: qemu-3dfx-ubuntu-x86_64.tar.gz
